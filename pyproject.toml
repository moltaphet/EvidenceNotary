# EvidenceNotary -- Consensus Web Attestation Protocol (GenLayer).
#
#   python3.12 -m venv .venv && . .venv/bin/activate
#   pip install --pre -r requirements.txt
#   pytest -q                                  # direct-mode suite, no network
#   genvm-lint check contracts/evidence_notary.py
[project]
name = "evidence-notary"
version = "0.1.0"
description = "Consensus web attestation / proof-of-existence protocol on GenLayer"
requires-python = ">=3.12"
dependencies = [
    "genlayer-test==0.30.0rc2",
    "genlayer-py==0.19.0rc2",
    "genvm-linter==0.11.1rc2",
    "pytest>=9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
